name: Linux benchmark grading preflight
on:
  push:
    branches: [codex/linux-full-setup]
    paths: ['.github/workflows/linux-benchmark-preflight.yml', 'e2e/ci/install-linux-desktop.sh']
  workflow_dispatch:
    inputs:
      halo_contract:
        description: 'Bookworm Node22 TigerVNC/XFCE shared-bus SDK contract with sandboxed Chrome'
        type: boolean
        default: false
      halo_native:
        description: 'Native typing completion and verified plaintext paste on TigerVNC; no browser acceptance'
        type: boolean
        default: false
      halo_capture:
        description: 'Native covered GTK capture control; does not certify Chrome'
        type: boolean
        default: false
      halo_capture_matrix:
        description: 'Build once and validate fresh compositor-off/on native desktops serially'
        type: boolean
        default: false
      halo_paste_probe:
        description: Raw GTK AT-SPI paste feasibility on an owned TigerVNC desktop; no SDK acceptance
        type: boolean
        default: false
      halo_paste_route:
        description: Independent raw paste probe route; each dispatch uses a fresh desktop
        type: choice
        options: ['atspi', 'foreground']
        default: atspi
      halo_sandbox_probe:
        description: 'Collect ordinary-user Chrome/namespace startup diagnostics without building the driver'
        type: boolean
        default: false
      halo_composited:
        description: 'Enable XFWM4 compositor for existing backing pixmap control'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  controls:
    if: ${{ !(inputs.halo_contract || inputs.halo_native || inputs.halo_capture || inputs.halo_capture_matrix || inputs.halo_sandbox_probe || inputs.halo_paste_probe) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the shared benchmark desktop and grader
        run: |
          bash e2e/ci/install-linux-desktop.sh
          npm ci --ignore-scripts
          npm run build
          npm ci --ignore-scripts --prefix e2e
          npm run typecheck --prefix e2e
          python -m pip install -r evals/parity/osworld/requirements.txt
          python evals/parity/osworld/fetch-assets.py
      - name: Check original completed and damaged documents
        env:
          OPENSKY_EVAL_LIBREOFFICE: /usr/bin/libreoffice
          OPENSKY_EVAL_CONTROL_ARTIFACTS: ${{ github.workspace }}/artifacts/controls
        run: |
          mkdir -p artifacts/controls
          export OPENSKY_EVAL_PYTHON="$(command -v python)"
          xvfb-run -a --server-args='-screen 0 1280x900x24' dbus-run-session -- \
            npm test --prefix e2e -- specs/osworld-score.test.ts specs/osworld-expanded-score.test.ts specs/impress-export-score.test.ts --bail=0 --reporter=verbose --reporter=json --outputFile.json="$PWD/artifacts/results.json"
      - name: Freeze references for both agent arms
        run: |
          xvfb-run -a --server-args='-screen 0 1280x900x24' dbus-run-session -- \
            python evals/parity/osworld/scoring_profile.py freeze \
            --controls artifacts/controls --output artifacts/scoring-profile \
            --libreoffice /usr/lib/libreoffice/program/soffice > artifacts/scoring-profile-freeze.json
          xvfb-run -a --server-args='-screen 0 1280x900x24' dbus-run-session -- \
            python evals/parity/osworld/scoring_profile.py verify \
            --profile artifacts/scoring-profile/profile.json \
            --libreoffice /usr/lib/libreoffice/program/soffice > artifacts/scoring-profile-verified.json
          dpkg-query -W libreoffice-core libreoffice-calc libreoffice-impress libreoffice-writer code > artifacts/app-packages.txt
          python -m pip freeze > artifacts/python-packages.txt
      - name: Retain immutable scoring references
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-scoring-profile
          path: artifacts/scoring-profile
          if-no-files-found: error
          retention-days: 90
      - name: Retain grading controls and exporter receipts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-grading-controls
          path: artifacts
          if-no-files-found: warn
          retention-days: 90

  paste-readiness:
    if: ${{ inputs.halo_paste_probe }}
    runs-on: ubuntu-24.04
    container: node:22-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install the ordinary-user native desktop experiment
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-gi python3-pyatspi gir1.2-atspi-2.0 gir1.2-gtk-3.0 tigervnc-standalone-server xfwm4 xfce4-panel dbus-x11 gsettings-desktop-schemas dconf-gsettings-backend at-spi2-core libatk-adaptor x11-utils xdotool wmctrl xclip fonts-dejavu
          useradd --create-home --uid 1001 halo
          mkdir -p artifacts/paste-readiness
          chown -R halo:halo artifacts/paste-readiness
          node --version > artifacts/paste-readiness/node.txt
          dpkg-query -W > artifacts/paste-readiness/packages.txt
      - name: Probe real clipboard insertion and selected-text behavior
        env:
          HALO_PASTE_PROBE_ROUTE: ${{ inputs.halo_paste_route }}
        run: |
          runuser -u halo -- env HALO_NATIVE_PASTE_PROBE_ONLY=1 HALO_PASTE_PROBE_ROUTE="$HALO_PASTE_PROBE_ROUTE" HALO_ARTIFACTS="$GITHUB_WORKSPACE/artifacts/paste-readiness" dbus-run-session -- bash e2e/halo/session.sh
      - name: Preserve actual GTK buffer, saved bytes, clipboard and exact owned cleanup
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: halo-native-paste-readiness
          path: artifacts/paste-readiness
          if-no-files-found: error
          retention-days: 90

  sandbox-readiness:
    if: ${{ inputs.halo_sandbox_probe }}
    runs-on: ubuntu-24.04
    container: node:22-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install ordinary sandbox probe prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang python3 curl ca-certificates
          curl -fSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb
          apt-get install -y /tmp/chrome.deb
          useradd --create-home --uid 1001 halo
          mkdir -p artifacts/sandbox-readiness
          chown -R halo:halo artifacts/sandbox-readiness
      - name: Require unchanged-policy ordinary-user Chrome sandbox startup
        run: runuser -u halo -- python3 e2e/halo/sandbox-preflight.py --output artifacts/sandbox-readiness --require-ready
      - name: Preserve exact namespace refusals and browser startup logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: halo-sandbox-readiness
          path: artifacts/sandbox-readiness
          if-no-files-found: error
          retention-days: 90

  halo:
    if: ${{ inputs.halo_contract || inputs.halo_native || inputs.halo_capture || inputs.halo_capture_matrix }}
    runs-on: ubuntu-24.04
    container: node:22-bookworm
    timeout-minutes: 40
    env:
      HALO_DRIVER_REF: c36e63ef8e7387cd827596169396b63cbfe68f30
      CUA_DRIVER_SOURCE_SHA: c36e63ef8e7387cd827596169396b63cbfe68f30
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: tanishqkancharla/cua
          ref: ${{ env.HALO_DRIVER_REF }}
          path: driver
      - name: Install Bookworm build and desktop packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang pkg-config libdbus-1-dev libx11-dev libxi-dev libxtst-dev libxext-dev libxkbcommon-dev libssl-dev curl ca-certificates tigervnc-standalone-server xfwm4 xfce4-panel dbus-x11 gsettings-desktop-schemas dconf-gsettings-backend at-spi2-core libatk-adaptor python3-gi python3-pil gir1.2-gtk-3.0 x11-utils xdotool wmctrl xclip fonts-dejavu fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
          curl -fSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/chrome.deb
          apt-get install -y /tmp/chrome.deb
          useradd --create-home --uid 1001 halo
      - name: Require Chrome sandbox readiness before a full contract build
        if: ${{ inputs.halo_contract }}
        run: |
          mkdir -p artifacts/halo/sandbox-readiness
          chown -R halo:halo artifacts/halo/sandbox-readiness
          runuser -u halo -- python3 e2e/halo/sandbox-preflight.py --output artifacts/halo/sandbox-readiness --require-ready
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          workspaces: 'driver/libs/cua-driver/rust -> target'
          cache-on-failure: true
      - name: Build immutable driver and SDK
        run: |
          mkdir -p artifacts/halo
          cargo build --release --locked -p cua-driver --manifest-path driver/libs/cua-driver/rust/Cargo.toml
          cargo test --release --locked -p platform-linux --lib --manifest-path driver/libs/cua-driver/rust/Cargo.toml > artifacts/halo/platform-linux-unit.log 2>&1
          driver/libs/cua-driver/rust/target/release/cua-driver --opensky-driver-identity > artifacts/halo/identity.json
          sha256sum driver/libs/cua-driver/rust/target/release/cua-driver > artifacts/halo/driver-sha256.txt
          npm ci --ignore-scripts
          npm run build
          node --version > artifacts/halo/node.txt
          dpkg-query -W > artifacts/halo/packages.txt
      - name: Whole Node22 SDK diagnostics (CLI REPL failures retained separately)
        id: node22_whole
        continue-on-error: true
        run: npm test > artifacts/halo/unit-tests.log 2>&1
      - name: Required embedded SDK contracts on Node22
        run: |
          node --import tsx --test --test-timeout=60000 test/desktop-host.test.ts test/native-paste-capability.test.ts test/cua.test.ts test/opensky.test.ts test/typed-browser.test.ts test/opensky-lifecycle.test.ts test/async-lifecycle.test.ts test/mcp-driver.test.ts test/driver-parse.test.ts > artifacts/halo/embedded-sdk-tests.log 2>&1
      - name: Exercise unprivileged TigerVNC desktop with a single shared bus
        shell: bash
        env:
          HALO_NODE22_WHOLE_OUTCOME: ${{ steps.node22_whole.outcome }}
          HALO_NATIVE_CONTRACT_ONLY: ${{ inputs.halo_native && '1' || '0' }}
          HALO_NATIVE_CAPTURE_ONLY: ${{ (inputs.halo_capture || inputs.halo_capture_matrix) && '1' || '0' }}
          HALO_COMPOSITOR: ${{ inputs.halo_composited && 'on' || 'off' }}
          HALO_CAPTURE_MATRIX: ${{ inputs.halo_capture_matrix && '1' || '0' }}
        run: |
          chown -R halo:halo "$GITHUB_WORKSPACE"
          if [[ "$HALO_CAPTURE_MATRIX" == "1" ]]; then
            for compositor in off on; do
              directory="$GITHUB_WORKSPACE/artifacts/halo/capture-$compositor"
              mkdir -p "$directory"
              cp artifacts/halo/identity.json artifacts/halo/driver-sha256.txt "$directory/"
              chown -R halo:halo "$directory"
              runuser -u halo -- env HALO_ARTIFACTS="$directory" HALO_COMPOSITOR="$compositor" \
                dbus-run-session -- bash e2e/halo/session.sh
            done
            test -s artifacts/halo/capture-off/capture-evidence.json
            test -s artifacts/halo/capture-on/capture-evidence.json
          else
            runuser -u halo -- dbus-run-session -- bash e2e/halo/session.sh
          fi
      - name: Retain application effects, sandbox status, grants and original logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: halo-bookworm-contract
          path: artifacts/halo
          if-no-files-found: warn
          retention-days: 90
