name: Computer-use evals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_models:
        description: 'Explicit API-funded model eval opt-in; separate from tracked campaign CLI budget'
        type: boolean
        default: false
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: read

jobs:
  validate:
    # Independent model-free lanes give Linux/Node compatibility feedback even
    # when the Mac runner is queued. Keep the Mac-specific owner coverage.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: macos-15
            node: '24'
    runs-on: ${{ matrix.os }}
    concurrency:
      group: evals-validate-${{ github.ref }}-${{ matrix.os }}-${{ matrix.node }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check current agent-library integration types
        run: >-
          npm exec tsc -- --noEmit --target ES2022 --module Node16
          --moduleResolution Node16 --strict --skipLibCheck --types node
          evals/harness.ts evals/artifacts.ts test/eval-artifacts.test.ts
      - run: npm run evals -- browser.eval.ts --list
      - run: npm test

  real-driver:
    # Never cancel a desktop/model job merely because another commit arrived.
    concurrency:
      group: evals-desktop-${{ github.ref }}
      cancel-in-progress: false
    # Scheduled/ordinary runs validate without spending model credits.
    # API-funded evaluations require an explicit manual opt-in; campaign agents
    # remain serial Codex CLI runs under the parent budget/cleanup controller.
    if: github.event_name == 'workflow_dispatch' && inputs.run_models == true
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Require an exact fork revision
        env:
          OPENSKY_DRIVER_REF: ${{ vars.OPENSKY_DRIVER_REF }}
        run: |
          [[ "$OPENSKY_DRIVER_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'Set OPENSKY_DRIVER_REF to a published OpenSky Driver commit'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: tanishqkancharla/cua
          ref: ${{ vars.OPENSKY_DRIVER_REF }}
          path: .driver-source
      - name: Build OpenSky Driver from the pinned fork
        env:
          CUA_DRIVER_SOURCE_SHA: ${{ vars.OPENSKY_DRIVER_REF }}
        run: |
          mkdir -p evals/runs/ci
          bash .driver-source/libs/cua-driver/scripts/install.sh --release
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/opensky-driver" --opensky-driver-identity
          open -g /Applications/OpenSkyDriver.app --args serve
      - name: Real desktop capability probe
        env:
          OPENSKY_DRIVER_REF: ${{ vars.OPENSKY_DRIVER_REF }}
        run: node --import tsx evals/ci-preflight.ts
      - name: Evaluate OpenSky with Terra (serial cases)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'Missing OPENAI_API_KEY repository secret'; exit 1; }
          npm run evals -- browser.eval.ts --local --harness opensky --model openai/gpt-5.6-terra --timeout 180000 --output evals/runs/ci
      - name: Record score summary
        if: always()
        run: node --import tsx evals/report.ts evals/runs/ci >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals-${{ github.sha }}-${{ github.run_attempt }}
          path: evals/runs/ci
          retention-days: 30
          if-no-files-found: error
