name: Linux foreground browser host acceptance
on:
  workflow_dispatch:
    inputs:
      readiness_only:
        description: 'Collect unchanged-policy Chrome sandbox/install facts without building or desktop input'
        type: boolean
        default: false
      reuse_driver:
        description: 'Reuse the pinned independently verified Ubuntu22 driver artifact; source/hash mismatches refuse'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  halo-host:
    # This is separate Linux browser evidence, not Bookworm container acceptance.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      HALO_DRIVER_REF: 4a0189e286cf48c6b05da5bdd76ffebce4accc84
      CUA_DRIVER_SOURCE_SHA: 4a0189e286cf48c6b05da5bdd76ffebce4accc84
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: tanishqkancharla/cua
          ref: ${{ env.HALO_DRIVER_REF }}
          path: driver
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build and TigerVNC desktop packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang pkg-config libdbus-1-dev libx11-dev libxi-dev libxtst-dev libxext-dev libxkbcommon-dev libssl-dev curl ca-certificates tigervnc-standalone-server xfwm4 xfce4-panel dbus-x11 gsettings-desktop-schemas dconf-gsettings-backend at-spi2-core libatk-adaptor python3-gi python3-pil gir1.2-gtk-3.0 x11-utils xdotool wmctrl xclip fonts-dejavu fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji
          curl -fSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o /tmp/halo-chrome.deb
          sudo apt-get install -y /tmp/halo-chrome.deb
          # The hosted image makes these root-owned directories world-writable.
          # Tighten the packaged installation; never weaken driver trust checks.
          mkdir -p artifacts/halo
          stat -c '%n uid=%u gid=%g mode=%a type=%F' /opt /opt/google /opt/google/chrome > artifacts/halo/chrome-installation-before.txt
          for directory in /opt /opt/google /opt/google/chrome; do
            test "$(stat -c %u "$directory")" = 0
            test ! -L "$directory"
          done
          sudo chmod go-w /opt /opt/google /opt/google/chrome
      - name: Require ordinary-user sandbox startup before building
        run: |
          mkdir -p artifacts/halo
          cp /etc/os-release artifacts/halo/os-release.txt
          id > artifacts/halo/desktop-user.txt
          cat /proc/self/status > artifacts/halo/host-process-status.txt
          namei -l /opt/google/chrome/google-chrome /opt/google/chrome/chrome /usr/bin/google-chrome-stable > artifacts/halo/chrome-installation.txt
          stat -c '%n uid=%u gid=%g mode=%a type=%F' / /opt /opt/google /opt/google/chrome /opt/google/chrome/google-chrome /opt/google/chrome/chrome > artifacts/halo/chrome-installation-stat.txt
          python3 e2e/halo/sandbox-preflight.py --output artifacts/halo/sandbox-readiness --require-ready
      - uses: dtolnay/rust-toolchain@1.97.1
        if: ${{ !inputs.readiness_only && !inputs.reuse_driver }}
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        if: ${{ !inputs.readiness_only && !inputs.reuse_driver }}
        with:
          workspaces: 'driver/libs/cua-driver/rust -> target'
          cache-on-failure: true
      - name: Retrieve the pinned first-party build without executing it
        if: ${{ !inputs.readiness_only && inputs.reuse_driver }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: halo-ubuntu22-host-contract
          run-id: '38908929381'
          github-token: ${{ github.token }}
          path: prebuilt-halo
      - name: Build exact driver and SDK
        if: ${{ !inputs.readiness_only }}
        env:
          HALO_REUSE_DRIVER_BUILD: ${{ inputs.reuse_driver && '1' || '0' }}
        run: |
          if [[ "$HALO_REUSE_DRIVER_BUILD" == "1" ]]; then
            node e2e/halo/verify-driver-build.mjs prebuilt-halo "$HALO_DRIVER_REF" driver/libs/cua-driver/rust/target/release/cua-driver artifacts/halo/driver-build-proof.json
          else
            cargo build --release --locked -p cua-driver --manifest-path driver/libs/cua-driver/rust/Cargo.toml
            cargo test --release --locked -p platform-linux --lib --manifest-path driver/libs/cua-driver/rust/Cargo.toml > artifacts/halo/platform-linux-unit.log 2>&1
            printf '{"mode":"fresh-driver-build","freshDriverUnits":true}\n' > artifacts/halo/driver-build-proof.json
          fi
          driver/libs/cua-driver/rust/target/release/cua-driver --opensky-driver-identity > artifacts/halo/identity.json
          sha256sum driver/libs/cua-driver/rust/target/release/cua-driver > artifacts/halo/driver-sha256.txt
          cp driver/libs/cua-driver/rust/target/release/cua-driver artifacts/halo/opensky-driver
          npm ci --ignore-scripts
          npm run build
          node --version > artifacts/halo/node.txt
          dpkg-query -W > artifacts/halo/packages.txt
      - name: Required embedded SDK contracts on Node22
        if: ${{ !inputs.readiness_only }}
        run: |
          node --import tsx --test --test-timeout=60000 test/desktop-host.test.ts test/native-paste-capability.test.ts test/cua.test.ts test/opensky.test.ts test/typed-browser.test.ts test/opensky-lifecycle.test.ts test/async-lifecycle.test.ts test/mcp-driver.test.ts test/driver-parse.test.ts > artifacts/halo/embedded-sdk-tests.log 2>&1
      - name: Existing full contract on ordinary-user TigerVNC and shared bus
        if: ${{ !inputs.readiness_only }}
        env:
          HALO_NODE22_WHOLE_OUTCOME: not_run_host_lane
        run: dbus-run-session -- bash e2e/halo/session.sh
      - name: Preserve actual effects and sandbox evidence with host environment label
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ${{ inputs.readiness_only && 'halo-ubuntu22-host-readiness' || 'halo-ubuntu22-host-contract' }}
          path: artifacts/halo
          if-no-files-found: warn
          retention-days: 90
