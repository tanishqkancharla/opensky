name: Linux paired agent evaluation
run-name: ${{ inputs.mode == 'agent' && format('Linux agent / {0}', inputs.reservation_id) || format('Linux setup / {0}', inputs.setup_task || 'writer') }}

on:
  push:
    branches: [codex/computer-observed-parity]
    paths: ['.github/workflows/linux-agent.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [setup, repl, agent]
        default: setup
      setup_task:
        description: 'Benchmark task to validate without a model in setup mode'
        type: string
        default: '3ef2b351-8a84-4ff2-8724-d86eae9b842e'
      reservation_id:
        type: string
        default: ''
      envelope:
        description: 'Cumulative controller reservation, bound to this source SHA'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-agent-${{ inputs.mode == 'agent' && inputs.reservation_id || github.run_id }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    env:
      OPENSKY_LINUX_AGENT_MODE: ${{ inputs.mode || 'setup' }}
      OPENSKY_AGENT_TASK: ${{ inputs.setup_task || '3ef2b351-8a84-4ff2-8724-d86eae9b842e' }}
      OPENSKY_EVAL_SCORING_PROFILE: ${{ github.workspace }}/.scoring-profile/profile.json
      OPENSKY_EVAL_SCORING_PROFILE_SHA256: c7fa3e09273f8e9c0704eb872361ee8b8a0b41b388efacc206e8b0cb63a26565
      OPENSKY_NATIVE_PACKAGE_SHA256: 2caa7df314ce37e9048359d8e6a4a78e24574a3b54d6bf510f17754b66dda775
      OPENSKY_NATIVE_PACKAGE_FILE: ${{ github.workspace }}/.native-reference/chatgpt.deb
      OPENSKY_LINUX_OFFICE_ARTIFACT: ${{ github.workspace }}/artifacts/linux-office
      OPENSKY_REMOTE_RESERVATION: ${{ inputs.reservation_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop and scorer
        run: |
          printf 'OPENSKY_REMOTE_BUDGET=%s\n' "$RUNNER_TEMP/opensky-agent-budget/ledger.json" >> "$GITHUB_ENV"
          bash e2e/ci/install-linux-desktop.sh
          npm ci --ignore-scripts
          npm run build
          if [[ "$OPENSKY_LINUX_AGENT_MODE" == repl ]]; then npm ci --ignore-scripts --prefix e2e; fi
          python -m pip install -r evals/parity/osworld/requirements.txt
          python evals/parity/osworld/fetch-assets.py
      - name: Use the pinned candidate driver
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: sdk-test-driver
          run-id: 34394343940
          github-token: ${{ github.token }}
          path: .driver
      - name: Verify the exact tested driver binary
        run: |
          printf '%s\n' '4031b914b757bde656f5ea6d0b4ca4cb612fbaa8d3d91e3e7b3e4671fd796d99  .driver/opensky-driver' | sha256sum --check -
          chmod +x .driver/opensky-driver
      - name: Use the single frozen Linux grading profile
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: linux-scoring-profile
          run-id: 34309681923
          github-token: ${{ github.token }}
          path: .scoring-profile
      - name: Verify grading references before admitting model spending
        run: |
          mkdir -p artifacts/linux-office
          python evals/parity/osworld/scoring_profile.py verify \
            --profile "$OPENSKY_EVAL_SCORING_PROFILE" \
            --libreoffice /usr/lib/libreoffice/program/soffice > artifacts/linux-office/profile-admission.json
          python - <<'PYTHON'
          import json, os
          profile = json.load(open('artifacts/linux-office/profile-admission.json'))
          assert profile['sha256'] == os.environ['OPENSKY_EVAL_SCORING_PROFILE_SHA256']
          PYTHON
      - name: Use the frozen native reference package
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: native-reference-linux-x64
          run-id: 34310637093
          github-token: ${{ github.token }}
          path: .native-reference
      - name: Verify the frozen native reference before admitting model spending
        run: printf '%s  %s\n' "$OPENSKY_NATIVE_PACKAGE_SHA256" "$OPENSKY_NATIVE_PACKAGE_FILE" | sha256sum --check -
      - name: Admit the existing cumulative reservation once
        if: inputs.mode == 'agent'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENSKY_RESERVATION_ENVELOPE: ${{ inputs.envelope }}
        run: node --import tsx evals/parity/remote-admission.ts
      - name: Run the isolated desktop task
        env:
          OPENAI_API_KEY: ${{ inputs.mode == 'agent' && secrets.OPENAI_API_KEY || '' }}
        run: bash e2e/ci/native-linux-probe.sh
      - name: Retain task result and spending receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-agent-result
          path: |
            artifacts/linux-office
            artifacts/native-linux
          retention-days: 30
