name: Linux paired agent evaluation
run-name: ${{ inputs.mode == 'agent' && format('Linux agent / {0}', inputs.reservation_id) || format('Linux setup / {0}', inputs.setup_task || 'writer') }}

on:
  push:
    branches: [codex/computer-observed-parity]
    paths: ['.github/workflows/linux-agent.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [setup, repl, agent]
        default: setup
      repl_case:
        description: 'Deterministic public-interface regression; used only in repl mode'
        type: choice
        options: [async-typing, dropdown, program, clipboard]
        default: async-typing
      setup_task:
        description: 'Benchmark task to validate without a model in setup mode'
        type: string
        default: '3ef2b351-8a84-4ff2-8724-d86eae9b842e'
      reservation_id:
        type: string
        default: ''
      envelope:
        description: 'Cumulative controller reservation, bound to this source SHA'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-agent-${{ inputs.mode == 'agent' && inputs.reservation_id || github.run_id }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    env:
      OPENSKY_LINUX_NATIVE_FACADE: '1'
      OPENSKY_LINUX_AGENT_MODE: ${{ inputs.mode || 'setup' }}
      OPENSKY_REPL_CASE: ${{ inputs.repl_case || 'async-typing' }}
      OPENSKY_AGENT_TASK: ${{ inputs.setup_task || '3ef2b351-8a84-4ff2-8724-d86eae9b842e' }}
      OPENSKY_EVAL_SCORING_PROFILE: ${{ github.workspace }}/.scoring-profile/profile.json
      OPENSKY_EVAL_SCORING_PROFILE_SHA256: 15218ca4acdfd6bf4deebe2a9c582aa302cd987b4b26dda615599ac0ab46ecf8
      OPENSKY_NATIVE_PACKAGE_SHA256: 9498e417131a278bce35bfff6275d252c0d332f17afc0313e0b782749f4d348a
      OPENSKY_NATIVE_PACKAGE_FILE: ${{ github.workspace }}/.native-reference/chatgpt.deb
      OPENSKY_LINUX_OFFICE_ARTIFACT: ${{ github.workspace }}/artifacts/linux-office
      OPENSKY_REMOTE_RESERVATION: ${{ inputs.reservation_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify exact benchmark asset cache
        id: benchmark-assets
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path("evals/parity/osworld")
          manifest = (root / "manifest.json").read_bytes()
          paths = []
          for task in json.loads(manifest)["tasks"]:
              assert re.fullmatch(r"[a-f0-9-]{36}", task["id"])
              for asset in task["assets"]:
                  name = asset["file"]
                  assert re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_. -]*", name) and ".." not in name
                  paths.append(str(root / task["id"] / name))
          assert paths and len(paths) == len(set(paths))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("key=linux-benchmark-assets-v1-" + hashlib.sha256(manifest).hexdigest() + "\n")
              output.write("paths<<ASSET_PATHS\n" + "\n".join(paths) + "\nASSET_PATHS\n")
          PYTHON
      - name: Restore exact benchmark assets
        id: restore-benchmark-assets
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.benchmark-assets.outputs.paths }}
          key: ${{ steps.benchmark-assets.outputs.key }}
          # No restore-keys: a different manifest must be a cold miss.
      - name: Refuse a nonexact asset cache restore
        env:
          EXPECTED_CACHE_KEY: ${{ steps.benchmark-assets.outputs.key }}
          RESTORED_CACHE_KEY: ${{ steps.restore-benchmark-assets.outputs.cache-matched-key }}
        run: |
          if [[ -n "$RESTORED_CACHE_KEY" && "$RESTORED_CACHE_KEY" != "$EXPECTED_CACHE_KEY" ]]; then
            printf '%s\n' 'Refusing an asset cache for a different manifest' >&2
            exit 1
          fi
      - name: Install desktop and scorer
        run: |
          printf 'OPENSKY_REMOTE_BUDGET=%s\n' "$RUNNER_TEMP/opensky-agent-budget/ledger.json" >> "$GITHUB_ENV"
          bash e2e/ci/install-linux-desktop.sh
          npm ci --ignore-scripts
          npm run build
          if [[ "$OPENSKY_LINUX_AGENT_MODE" == repl ]]; then npm ci --ignore-scripts --prefix e2e; fi
          if [[ "$OPENSKY_LINUX_AGENT_MODE" == repl && "$OPENSKY_REPL_CASE" == program ]]; then python -m pip install python-xlib==0.33; fi
          python -m pip install -r evals/parity/osworld/requirements.txt
          python evals/parity/osworld/fetch-assets.py
      - name: Cache all hash-verified benchmark assets
        if: steps.restore-benchmark-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.benchmark-assets.outputs.paths }}
          key: ${{ steps.benchmark-assets.outputs.key }}
      - name: Check named-sheet scoring before admitting model spending
        run: |
          mkdir -p artifacts/linux-office
          python evals/parity/osworld/check_named_sheet_content.py > artifacts/linux-office/named-sheet-content-check.json
      - name: Use the pinned candidate driver
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: sdk-test-driver
          run-id: 37794063119
          github-token: ${{ github.token }}
          path: .driver
      - name: Verify the exact tested driver binary
        run: |
          printf '%s\n' '1b9f1381c7a01243169d05c2a768576613eaef4843a8ef3aefefd97d96c6f1d5  .driver/opensky-driver' | sha256sum --check -
          chmod +x .driver/opensky-driver
          .driver/opensky-driver --opensky-driver-identity > artifacts/linux-office/driver-identity.json
          python - <<'PYTHON'
          import json
          actual = json.load(open('artifacts/linux-office/driver-identity.json'))
          retained = json.load(open('.driver/identity.json'))
          assert actual == retained
          assert (actual['product'], actual['protocolVersion'], actual['source']) == (
              'opensky-driver', 1, '77f3406a4da1430fec4ccd96e7154c6df9303459')
          PYTHON
      - name: Use the single frozen Linux grading profile
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: linux-scoring-profile
          run-id: 37806735377
          github-token: ${{ github.token }}
          path: .scoring-profile
      - name: Verify grading references before admitting model spending
        run: |
          mkdir -p artifacts/linux-office
          xvfb-run -a --server-args='-screen 0 1280x900x24' dbus-run-session -- \
            python evals/parity/osworld/scoring_profile.py verify \
            --profile "$OPENSKY_EVAL_SCORING_PROFILE" \
            --libreoffice /usr/lib/libreoffice/program/soffice > artifacts/linux-office/profile-admission.json
          python - <<'PYTHON'
          import json, os
          profile = json.load(open('artifacts/linux-office/profile-admission.json'))
          assert profile['sha256'] == os.environ['OPENSKY_EVAL_SCORING_PROFILE_SHA256']
          PYTHON
      - name: Use original grading control documents for setup contracts
        if: inputs.mode == 'setup'
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: linux-grading-controls
          run-id: 37806735377
          github-token: ${{ github.token }}
          path: .grading-controls
      - name: Verify comparison and grading contracts before model-free setup
        if: inputs.mode == 'setup'
        env:
          OPENSKY_EVAL_TEST_SCORING_PROFILE: ${{ env.OPENSKY_EVAL_SCORING_PROFILE }}
          OPENSKY_EVAL_LIBREOFFICE: /usr/lib/libreoffice/program/soffice
          OPENSKY_EVAL_CONTROL_ARTIFACTS: ${{ github.workspace }}/.grading-controls/controls
        run: |
          export OPENSKY_EVAL_PYTHON="$(command -v python)"
          test -f "$OPENSKY_EVAL_CONTROL_ARTIFACTS/2b94c692-6abb-48ae-ab0b-b3e8a19cb340/completed/completed.pptx"
          npm ci --ignore-scripts --prefix e2e
          npm run typecheck --prefix e2e
          xvfb-run -a --server-args='-screen 0 1280x900x24' dbus-run-session -- \
            npm test --prefix e2e -- specs/linux-parity-policy.test.ts specs/linux-current-facade-policy.test.ts specs/desktop-control-flow-policy.test.ts specs/desktop-expression-policy.test.ts specs/lexical-state-policy.test.ts specs/parity-admission.test.ts specs/parity-budget.test.ts specs/scoring-profile.test.ts specs/osworld-score.test.ts --bail=0 --reporter=verbose --reporter=json --outputFile.json="$PWD/artifacts/linux-office/comparison-contracts.json"
      - name: Use the frozen native reference package
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: native-reference-current-linux-x64
          run-id: 37637263448
          github-token: ${{ github.token }}
          path: .native-reference
      - name: Verify the frozen native reference before admitting model spending
        run: printf '%s  %s\n' "$OPENSKY_NATIVE_PACKAGE_SHA256" "$OPENSKY_NATIVE_PACKAGE_FILE" | sha256sum --check -
      - name: Admit the existing cumulative reservation once
        if: inputs.mode == 'agent'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENSKY_RESERVATION_ENVELOPE: ${{ inputs.envelope }}
        run: node --import tsx evals/parity/remote-admission.ts
      - name: Run the isolated desktop task
        env:
          OPENAI_API_KEY: ${{ inputs.mode == 'agent' && secrets.OPENAI_API_KEY || '' }}
        run: bash e2e/ci/native-linux-probe.sh
      - name: Retain task result and spending receipt
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-agent-result
          path: |
            artifacts/linux-office
            artifacts/native-linux
          retention-days: 30
