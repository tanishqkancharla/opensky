name: Linux typing regression

on:
  push:
    branches: [codex/linux-input-parity]
    paths: ['src/**', 'e2e/**', '.github/workflows/linux-typing.yml']
  workflow_dispatch:
    inputs:
      build_only:
        description: Build a candidate for focused one-off remote tests
        type: boolean
        default: false
      driver_artifact_run:
        description: Existing driver build run; reuse requires a separately pinned release SHA-256
        type: string
        default: ''
      test_name_pattern:
        description: 'Optional focused Vitest name pattern; empty runs all typing cases'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  OPENSKY_DRIVER_REF: cfe578ba53afce435486694bcb0048e81f2d9a34
  # This is intentionally empty until a candidate release artifact has been
  # recorded and independently pinned. A fresh same-run build is verified by
  # its artifact manifest; reuse is rejected while this expected value is unset.
  OPENSKY_DRIVER_SHA256: ''
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  driver:
    if: ${{ inputs.driver_artifact_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tanishqkancharla/cua
          ref: ${{ env.OPENSKY_DRIVER_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: 'libs/cua-driver/rust -> target'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libei-dev libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev xvfb xauth openbox x11-utils
      - name: Build pinned OpenSky Driver
        env:
          CUA_DRIVER_SOURCE_SHA: ${{ env.OPENSKY_DRIVER_REF }}
        run: |
          cargo build --release --locked -p cua-driver --manifest-path libs/cua-driver/rust/Cargo.toml
          cargo test --release --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml text_selection::tests
          cargo test --release --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml text_keysyms_cover_latin1_unicode_and_control_keys
          cargo test --release --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml hotkey_alias_tests
          cargo test --release --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml virtual_table_tests
          cargo test --release --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml atspi::native::coord_tests
          cargo test --release --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml frame_correlation_tests
          cargo test --release --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml atspi::cache::tests
          cargo test --release --locked -p cua-driver-core --lib --manifest-path libs/cua-driver/rust/Cargo.toml select_text
          cargo test --release --locked -p cua-driver-core --lib --manifest-path libs/cua-driver/rust/Cargo.toml element_token::tests
          cargo test --release --locked -p cua-driver-core --lib --manifest-path libs/cua-driver/rust/Cargo.toml every_known_legacy_action_path_normalizes
          CUA_POPUP_CAPTURE_DISPOSABLE_X11=1 xvfb-run -a --server-args="-screen 0 1280x900x24" bash -euo pipefail -c '
            openbox >/tmp/popup-openbox.log 2>&1 & wm=$!
            trap "kill $wm 2>/dev/null || true" EXIT
            wm_ready=0
            for attempt in $(seq 1 100); do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"; then wm_ready=1; break; fi
              sleep 0.1
            done
            test "$wm_ready" = 1
            cargo test --release --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml capture::popup::live_tests -- --ignored --nocapture --test-threads=1
          '
          cargo test --release --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml capture::popup::tests
          cargo test --release --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml input::path_tests
          mkdir -p driver-artifact
          cp libs/cua-driver/rust/target/release/cua-driver driver-artifact/opensky-driver
          driver-artifact/opensky-driver --opensky-driver-identity > driver-artifact/identity.json
          (
            cd driver-artifact
            sha256sum opensky-driver > sha256.txt
          )
          python3 - <<'PY'
          import json, os, re
          identity = json.load(open('driver-artifact/identity.json'))
          assert identity['product'] == 'opensky-driver' and identity['protocolVersion'] == 1
          assert identity['source'] == os.environ['OPENSKY_DRIVER_REF']
          manifest = open('driver-artifact/sha256.txt').read().strip()
          assert re.fullmatch(r'[0-9a-f]{64}  opensky-driver', manifest), manifest
          PY
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: sdk-test-driver
          path: driver-artifact
          retention-days: 14

  evaluate:
    if: ${{ always() && !cancelled() && !inputs.build_only && (needs.driver.result == 'success' || (needs.driver.result == 'skipped' && inputs.driver_artifact_run != '')) }}
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    needs: driver
    runs-on: ubuntu-24.04
    env:
      OPENSKY_LINUX_OFFICE_BACKEND: opensky
      OPENSKY_LINUX_TYPING_TEST: '1'
      OPENSKY_X11_INPUT_RECORD: '1'
      OPENSKY_ATSPI_TEXT_RECORD: '1'
      OPENSKY_LINUX_TEST_NAME_PATTERN: ${{ inputs.test_name_pattern }}
      OPENSKY_AGENT_TASK: 3ef2b351-8a84-4ff2-8724-d86eae9b842e
      OPENSKY_NATIVE_PACKAGE_SHA256: 2caa7df314ce37e9048359d8e6a4a78e24574a3b54d6bf510f17754b66dda775
      OPENSKY_NATIVE_PACKAGE_FILE: ${{ github.workspace }}/.native-reference/chatgpt.deb
      OPENSKY_REUSED_DRIVER_RUN: ${{ inputs.driver_artifact_run }}
      OPENSKY_LINUX_OFFICE_ARTIFACT: ${{ github.workspace }}/artifacts/linux-office
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop and scorer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 openbox at-spi2-core python3-gi gir1.2-atspi-2.0 xdotool x11-utils x11-xserver-utils libreoffice-writer libreoffice-gtk3 fonts-liberation tesseract-ocr libpipewire-0.3-0 libei1 libxtst6
          npm ci --ignore-scripts
          npm run build
          npm ci --ignore-scripts --prefix e2e
          npm run typecheck --prefix e2e
          python -m pip install -r evals/parity/osworld/requirements.txt
          python -m pip install python-xlib==0.33 six==1.17.0
      - name: Use the frozen native reference package
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: native-reference-linux-x64
          run-id: 34310637093
          github-token: ${{ github.token }}
          path: .native-reference
      - name: Validate reuse inputs
        if: inputs.driver_artifact_run != ''
        run: |
          [[ "$OPENSKY_REUSED_DRIVER_RUN" =~ ^[0-9]+$ ]]
          [[ "$OPENSKY_DRIVER_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo 'Refusing driver artifact reuse until OPENSKY_DRIVER_SHA256 is independently pinned'
            exit 1
          }
      - name: Use the verified driver candidate
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: sdk-test-driver
          run-id: ${{ inputs.driver_artifact_run || github.run_id }}
          github-token: ${{ github.token }}
          path: .driver
      - name: Verify the exact tested driver binary
        run: |
          test -s .driver/sha256.txt
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          identity = json.load(open(".driver/identity.json"))
          assert identity["source"] == os.environ["OPENSKY_DRIVER_REF"]
          assert identity["product"] == "opensky-driver" and identity["protocolVersion"] == 1
          manifest = open(".driver/sha256.txt").read().strip()
          match = re.fullmatch(r"([0-9a-f]{64})  opensky-driver", manifest)
          assert match, manifest
          actual_sha256 = hashlib.sha256(open(".driver/opensky-driver", "rb").read()).hexdigest()
          assert actual_sha256 == match.group(1)
          expected_sha256 = os.environ["OPENSKY_DRIVER_SHA256"]
          if expected_sha256:
              assert expected_sha256 == actual_sha256
          else:
              assert not os.environ["OPENSKY_REUSED_DRIVER_RUN"], "reuse requires an independent release pin"
          os.chmod(".driver/opensky-driver", 0o755)
          actual = json.loads(subprocess.check_output([".driver/opensky-driver", "--opensky-driver-identity"]))
          assert actual == identity
          PY
          chmod +x .driver/opensky-driver
      - name: Verify public SDK typing and saved text
        run: bash e2e/ci/native-linux-probe.sh
      - name: Retain outcome and cleanup evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-typing-result-${{ matrix.attempt }}
          path: |
            artifacts/linux-office
            artifacts/native-linux
            .driver/identity.json
            .driver/sha256.txt
          retention-days: 30
