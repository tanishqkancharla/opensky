name: Linux refreshed Calc index regression

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    env:
      CUA_ATSPI_DEBUG: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the same hosted desktop
        run: |
          bash e2e/ci/install-linux-desktop.sh
          npm ci --ignore-scripts
          npm run build
          npm ci --ignore-scripts --prefix e2e
          npm run typecheck --prefix e2e
          python evals/parity/osworld/fetch-assets.py
      - name: Download the certified release binary without rebuilding
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: linux-candidate-release-driver
          run-id: 34580005558
          github-token: ${{ github.token }}
          path: .driver
      - name: Verify the exact binary and identity
        run: |
          mkdir -p artifacts/linux-office
          printf '%s\n' '8b50bfbdbd9c98aaa5d0ff9d4f2196b18115b96fe6c2d68847ddb16c21ce6692  .driver/opensky-driver' | sha256sum --check -
          chmod +x .driver/opensky-driver
          .driver/opensky-driver --opensky-driver-identity > artifacts/linux-office/driver-identity.json
          python - <<'PYTHON'
          import json
          actual = json.load(open('artifacts/linux-office/driver-identity.json'))
          assert actual == json.load(open('.driver/identity.json'))
          assert (actual['product'], actual['protocolVersion'], actual['source']) == (
              'opensky-driver', 1, 'ed9fd15e39a1d2acd07c4f3078440c3ab2ad44f2')
          PYTHON
          sha256sum .driver/opensky-driver > artifacts/linux-office/driver-sha256.txt
      - name: Run the exact panel and Undo SDK replay once
        run: |
          xvfb-run -a --server-args='-screen 0 1280x900x24' dbus-run-session -- \
            bash e2e/ci/linux-calc-refreshed-index.sh
      - name: Retain outcomes, debug trace and cleanup even on failure
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-calc-refreshed-index
          path: artifacts/linux-office
          if-no-files-found: error
          retention-days: 30
