name: Linux typing regression

on:
  push:
    branches: [codex/linux-input-parity]
    paths: ['src/**', 'e2e/**', '.github/workflows/linux-typing.yml']
  workflow_dispatch:
    inputs:
      build_only:
        description: Build a candidate for focused one-off remote tests
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  OPENSKY_DRIVER_REF: 2ff75ef21a5173935fd4cbd1b69fa6094299211d
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tanishqkancharla/cua
          ref: ${{ env.OPENSKY_DRIVER_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: 'libs/cua-driver/rust -> target'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libei-dev libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev
      - name: Build pinned OpenSky Driver
        env:
          CUA_DRIVER_SOURCE_SHA: ${{ env.OPENSKY_DRIVER_REF }}
        run: |
          cargo build --locked -p cua-driver --manifest-path libs/cua-driver/rust/Cargo.toml
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml text_selection::tests
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml text_keysyms_cover_latin1_unicode_and_control_keys
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml hotkey_alias_tests
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml virtual_table_tests
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml atspi::native::coord_tests
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml frame_correlation_tests
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml atspi::cache::tests
          cargo test --locked -p cua-driver-core --lib --manifest-path libs/cua-driver/rust/Cargo.toml select_text
          cargo test --locked -p cua-driver-core --lib --manifest-path libs/cua-driver/rust/Cargo.toml element_token::tests
          cargo test --locked -p cua-driver-core --lib --manifest-path libs/cua-driver/rust/Cargo.toml every_known_legacy_action_path_normalizes
          mkdir -p driver-artifact
          cp libs/cua-driver/rust/target/debug/cua-driver driver-artifact/opensky-driver
          driver-artifact/opensky-driver --opensky-driver-identity > driver-artifact/identity.json
          python3 - <<'PY'
          import json, os
          identity = json.load(open('driver-artifact/identity.json'))
          assert identity['product'] == 'opensky-driver' and identity['protocolVersion'] == 1
          assert identity['source'] == os.environ['OPENSKY_DRIVER_REF']
          PY
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: sdk-test-driver
          path: driver-artifact
          retention-days: 14

  evaluate:
    if: ${{ !inputs.build_only }}
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    needs: driver
    runs-on: ubuntu-24.04
    env:
      OPENSKY_LINUX_OFFICE_BACKEND: opensky
      OPENSKY_LINUX_TYPING_TEST: '1'
      OPENSKY_AGENT_TASK: 3ef2b351-8a84-4ff2-8724-d86eae9b842e
      OPENSKY_NATIVE_PACKAGE_SHA256: 62580188d87c3d3a9369dab7c73b42a8a32518d4df8a2d5bae6466ddeac5c05e
      OPENSKY_LINUX_OFFICE_ARTIFACT: ${{ github.workspace }}/artifacts/linux-office
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop and scorer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 openbox at-spi2-core xdotool x11-utils x11-xserver-utils libreoffice-writer libreoffice-gtk3 fonts-liberation tesseract-ocr libpipewire-0.3-0 libei1 libxtst6
          npm ci --ignore-scripts
          npm run build
          npm ci --ignore-scripts --prefix e2e
          npm run typecheck --prefix e2e
          python -m pip install -r evals/parity/osworld/requirements.txt
      - name: Use the newly built driver candidate
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: sdk-test-driver
          path: .driver
      - name: Verify the exact tested driver binary
        run: |
          python3 - <<'PY'
          import json, os
          identity = json.load(open(".driver/identity.json"))
          assert identity["source"] == os.environ["OPENSKY_DRIVER_REF"]
          assert identity["product"] == "opensky-driver"
          PY
          sha256sum .driver/opensky-driver > .driver/sha256.txt
          chmod +x .driver/opensky-driver
      - name: Verify public SDK typing and saved text
        run: bash e2e/ci/native-linux-probe.sh
      - name: Retain outcome and cleanup evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-typing-result-${{ matrix.attempt }}
          path: |
            artifacts/linux-office
            artifacts/native-linux
            .driver/identity.json
            .driver/sha256.txt
          retention-days: 30
