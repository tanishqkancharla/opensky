name: Linux same-selection keyboard comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    env:
      OPENSKY_LINUX_AGENT_MODE: repl
      OPENSKY_REPL_CASE: hybrid-selection-arrows
      OPENSKY_NATIVE_PACKAGE_SHA256: 2caa7df314ce37e9048359d8e6a4a78e24574a3b54d6bf510f17754b66dda775
      OPENSKY_NATIVE_PACKAGE_FILE: ${{ github.workspace }}/.native-reference/chatgpt.deb
      OPENSKY_LINUX_OFFICE_ARTIFACT: ${{ github.workspace }}/artifacts/linux-office
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real desktop and public SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 openbox at-spi2-core xdotool x11-utils x11-xserver-utils libreoffice-writer libreoffice-gtk3 fonts-liberation libpipewire-0.3-0 libei1 libxtst6
          npm ci --ignore-scripts
          npm run build
          npm ci --ignore-scripts --prefix e2e
          npm run typecheck --prefix e2e
      - name: Use exact release-arm driver
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: sdk-test-driver
          run-id: 34561195062
          github-token: ${{ github.token }}
          path: .driver
      - name: Verify driver bytes and source
        run: |
          printf '%s\n' 'e65549f1a2d77d168581a2c2cc84585f90b51748a1cf85c2cf43bfca7a49ba85  .driver/opensky-driver' | sha256sum --check -
          chmod +x .driver/opensky-driver
          .driver/opensky-driver --opensky-driver-identity > .driver/live-identity.json
          python3 - <<'PYTHON'
          import json
          x=json.load(open('.driver/live-identity.json'))
          assert (x['product'],x['protocolVersion'],x['source']) == ('opensky-driver',1,'403572f34dfbdc83b17bda7fe4c351060be32785')
          PYTHON
      - name: Use frozen native reference
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: native-reference-linux-x64
          run-id: 34310637093
          github-token: ${{ github.token }}
          path: .native-reference
      - name: Run real keyboard comparison without a model
        run: bash e2e/ci/native-linux-probe.sh
      - name: Retain first outcomes, identity and owned cleanup
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-hybrid-arrow-result
          path: |
            artifacts/linux-office
            artifacts/native-linux
            .driver/live-identity.json
          if-no-files-found: error
          retention-days: 30
