name: Full Linux candidate certification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    name: Canonical Linux local installer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CUA_DRIVER_SOURCE_SHA: 403572f34dfbdc83b17bda7fe4c351060be32785
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - name: Define private installation paths
        run: |
          echo "CUA_DRIVER_LOCAL_HOME=$RUNNER_TEMP/opensky-install-home" >> "$GITHUB_ENV"
          echo "CUA_DRIVER_LOCAL_INSTALL_DIR=$RUNNER_TEMP/opensky-install-bin" >> "$GITHUB_ENV"
          echo "OPENSKY_INSTALL_ARTIFACT=$RUNNER_TEMP/opensky-install-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: tanishqkancharla/cua
          ref: ${{ env.CUA_DRIVER_SOURCE_SHA }}
          path: driver-source
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          workspaces: 'driver-source/libs/cua-driver/rust -> target'
          key: opensky-installer-release
      - name: Install canonical build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libei-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev \
            libxtst-dev libxext-dev
      - name: Install and exercise the actual installed product
        working-directory: driver-source
        run: bash ../scripts/verify-linux-installed-driver.sh
      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: rust-linux-install-local
          path: ${{ env.OPENSKY_INSTALL_ARTIFACT }}
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Canonical Linux / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [shared, native, capture]
    env:
      CUA_DRIVER_SOURCE_SHA: 403572f34dfbdc83b17bda7fe4c351060be32785
      CUA_E2E_SOURCE_SHA: 403572f34dfbdc83b17bda7fe4c351060be32785
      CUA_E2E_INTERNAL_LANE: ${{ matrix.lane }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: tanishqkancharla/cua
          ref: ${{ env.CUA_DRIVER_SOURCE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          workspaces: 'libs/cua-driver/rust -> target'
          key: opensky-full-linux-${{ matrix.lane }}
      - name: Install canonical desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-x11 at-spi2-core openbox picom python3-gi \
            gir1.2-gtk-3.0 gir1.2-gtk-4.0 libgtk-3-dev clang pkg-config \
            libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev \
            libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev ffmpeg gnome-keyring jq
      - name: Run the complete unchanged canonical lane
        run: |
          test "$(git rev-parse HEAD)" = "$CUA_DRIVER_SOURCE_SHA"
          unset CUA_E2E_CELL_FILTER CUA_E2E_HARNESS_FILTER
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- bash -lc \
            "eval \"\$(printf test-password | gnome-keyring-daemon --unlock --components=secrets)\"; openbox >/tmp/opensky-openbox.log 2>&1 & picom --backend xrender --config /dev/null >/tmp/opensky-picom.log 2>&1 & sleep 2; scripts/ci/linux/run-rust-e2e.sh"
      - name: Retain exact release binary after successful shared lane
        if: success() && matrix.lane == 'shared'
        run: |
          mkdir -p artifacts/certified-driver
          cp libs/cua-driver/rust/target/release/cua-driver artifacts/certified-driver/opensky-driver
          artifacts/certified-driver/opensky-driver --opensky-driver-identity > artifacts/certified-driver/identity.json
          sha256sum artifacts/certified-driver/opensky-driver > artifacts/certified-driver/binary-sha256.txt
          python3 - <<'VERIFY'
          import json,os
          p=json.load(open('artifacts/certified-driver/identity.json'))
          assert p['product']=='opensky-driver' and p['protocolVersion']==1 and p['source']==os.environ['CUA_DRIVER_SOURCE_SHA']
          VERIFY
      - name: Upload release binary
        if: success() && matrix.lane == 'shared'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-candidate-release-driver
          path: artifacts/certified-driver
          if-no-files-found: error
          retention-days: 14
      - name: Prepare small canonical metadata
        if: always()
        run: |
          python3 - <<'METADATA'
          import hashlib,json,os,pathlib,shutil,subprocess
          root=pathlib.Path('artifacts/cua-driver/linux')
          out=pathlib.Path('artifacts/canonical-metadata')
          out.mkdir(parents=True,exist_ok=False)
          files={}
          for name in ('cases.jsonl','results.jsonl','environment.jsonl','summary.md'):
              source=root/name
              if source.is_symlink() or not source.is_file():
                  files[name]={'status':'missing_or_nonregular'}
              elif source.stat().st_size > 2*1024*1024:
                  files[name]={'status':'omitted_oversize','bytes':source.stat().st_size}
              else:
                  data=source.read_bytes()
                  shutil.copyfile(source,out/name)
                  files[name]={'status':'copied','bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          head=subprocess.run(['git','rev-parse','HEAD'],capture_output=True,text=True)
          actual=head.stdout.strip() if head.returncode==0 else None
          receipt={
              'schema':'opensky-canonical-metadata/v1',
              'expectedDriverSource':os.environ['CUA_DRIVER_SOURCE_SHA'],
              'observedCheckoutSource':actual,
              'sourceMatches':actual==os.environ['CUA_DRIVER_SOURCE_SHA'],
              'workflowSource':os.environ['GITHUB_SHA'],
              'workflowRef':os.environ['GITHUB_WORKFLOW_REF'],
              'repository':os.environ['GITHUB_REPOSITORY'],
              'runId':int(os.environ['GITHUB_RUN_ID']),
              'runAttempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'runUrl':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              'jobKey':os.environ['GITHUB_JOB'],
              'lane':os.environ['CUA_E2E_INTERNAL_LANE'],
              'files':files,
              'scope':'Early inspection metadata only; not authoritative CI completion or recording acceptance. Missing/oversize files remain in the original full artifact when present.'}
          (out/'source-pin-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          METADATA
      - name: Upload small canonical metadata
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-candidate-${{ matrix.lane }}-metadata
          path: artifacts/canonical-metadata
          if-no-files-found: error
          retention-days: 14
      - name: Upload all canonical outcome evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-candidate-${{ matrix.lane }}
          path: artifacts/cua-driver
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
