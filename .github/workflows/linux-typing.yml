name: Linux selection observer recording certification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: Canonical Linux / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [native]
    env:
      CUA_DRIVER_SOURCE_SHA: 5143349f377a1e99e0c6be0561c85e9a0a480d81
      CUA_E2E_SOURCE_SHA: 5143349f377a1e99e0c6be0561c85e9a0a480d81
      CUA_E2E_INTERNAL_LANE: ${{ matrix.lane }}
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: tanishqkancharla/cua
          ref: ${{ env.CUA_DRIVER_SOURCE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          workspaces: 'libs/cua-driver/rust -> target'
          key: opensky-full-linux-${{ matrix.lane }}
      - name: Install canonical desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-x11 at-spi2-core openbox picom python3-gi \
            gir1.2-gtk-3.0 gir1.2-gtk-4.0 libgtk-3-dev clang pkg-config \
            libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libei-dev \
            libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev ffmpeg gnome-keyring jq
      - name: Run the complete unchanged canonical lane
        run: |
          test "$(git rev-parse HEAD)" = "$CUA_DRIVER_SOURCE_SHA"
          unset CUA_E2E_CELL_FILTER CUA_E2E_HARNESS_FILTER
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            dbus-run-session -- bash -lc \
            "eval \"\$(printf test-password | gnome-keyring-daemon --unlock --components=secrets)\"; openbox >/tmp/opensky-openbox.log 2>&1 & picom --backend xrender --config /dev/null >/tmp/opensky-picom.log 2>&1 & sleep 2; scripts/ci/linux/run-rust-e2e.sh"
      - name: Upload all canonical outcome evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-candidate-${{ matrix.lane }}
          path: artifacts/cua-driver
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
