name: Linux Calc selection candidate build

on:
  push:
    branches: [codex/linux-input-parity]
    paths: ['src/**', 'e2e/**', '.github/workflows/linux-typing.yml']
  workflow_dispatch:
    inputs:
      build_only:
        description: Build a candidate for focused one-off remote tests
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  OPENSKY_DRIVER_REF: 15adb87104fd3f61b10cf97b590cc81b06abe701
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'

jobs:
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tanishqkancharla/cua
          ref: ${{ env.OPENSKY_DRIVER_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: 'libs/cua-driver/rust -> target'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libei-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev
      - name: Build pinned OpenSky Driver
        env:
          CUA_DRIVER_SOURCE_SHA: ${{ env.OPENSKY_DRIVER_REF }}
        run: |
          cargo build --release --locked -p cua-driver --manifest-path libs/cua-driver/rust/Cargo.toml
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml text_selection::tests
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml text_keysyms_cover_latin1_unicode_and_control_keys
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml hotkey_alias_tests
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml virtual_table_tests
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml atspi::native::coord_tests
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml frame_correlation_tests
          cargo test --locked -p platform-linux --lib --manifest-path libs/cua-driver/rust/Cargo.toml atspi::cache::tests
          cargo test --locked -p cua-driver-core --lib --manifest-path libs/cua-driver/rust/Cargo.toml select_text
          cargo test --locked -p cua-driver-core --lib --manifest-path libs/cua-driver/rust/Cargo.toml element_token::tests
          cargo test --locked -p cua-driver-core --lib --manifest-path libs/cua-driver/rust/Cargo.toml every_known_legacy_action_path_normalizes
          mkdir -p driver-artifact
          cp libs/cua-driver/rust/target/release/cua-driver driver-artifact/opensky-driver
          driver-artifact/opensky-driver --opensky-driver-identity > driver-artifact/identity.json
          python3 - <<'PY'
          import json, os
          identity = json.load(open('driver-artifact/identity.json'))
          assert identity['product'] == 'opensky-driver' and identity['protocolVersion'] == 1
          assert identity['source'] == os.environ['OPENSKY_DRIVER_REF']
          PY
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: sdk-test-driver
          path: driver-artifact
          retention-days: 14
