name: Linux pixel typing refusal check
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CUA_DRIVER_SOURCE_SHA: ce1b14809a7dedffc19ae501b4b4779d1bb4e949
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: tanishqkancharla/cua
          ref: ${{ env.CUA_DRIVER_SOURCE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          workspaces: 'libs/cua-driver/rust -> target'
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-x11 at-spi2-core openbox picom python3-gi \
            gir1.2-gtk-3.0 libgtk-3-dev clang pkg-config libdbus-1-dev \
            libpipewire-0.3-dev libspa-0.2-dev libei-dev libxkbcommon-dev \
            libx11-dev libxi-dev libxtst-dev libxext-dev ffmpeg jq
      - name: Build exact candidate and canonical GTK3 fixture
        run: |
          test "$(git rev-parse HEAD)" = "$CUA_DRIVER_SOURCE_SHA"
          mkdir -p artifacts/refusal
          git rev-parse HEAD > artifacts/refusal/source-sha.txt
          cargo build --locked -p cua-driver --manifest-path libs/cua-driver/rust/Cargo.toml
          bash libs/cua-driver/tests/fixtures/build/linux.sh --only gtk3
          libs/cua-driver/rust/target/debug/cua-driver --opensky-driver-identity > artifacts/refusal/identity.json
          sha256sum libs/cua-driver/rust/target/debug/cua-driver > artifacts/refusal/binary-sha256.txt
          sha256sum libs/cua-driver/rust/crates/cua-driver/tests/harness_gtk3_test.rs > artifacts/refusal/test-sha256.txt
      - name: Exercise unchanged foreground and background pixel typing
        run: |
          export CUA_TEST_WORKSPACE_ROOT="$PWD/libs/cua-driver/rust"
          export CUA_TEST_DRIVER_BIN="$CUA_TEST_WORKSPACE_ROOT/target/debug/cua-driver"
          export CUA_TEST_APPS_ROOT="$CUA_TEST_WORKSPACE_ROOT/test-apps"
          export CUA_TEST_REQUIRE_FIXTURES=1 CUA_TEST_DRIVER_STDERR=1
          export CUA_E2E_FORBID_SKIPS=1 CUA_E2E_UNRESTRICTED_GUI=1 CUA_REQUIRE_GUI=1
          export CUA_E2E_SOURCE_SHA="$CUA_DRIVER_SOURCE_SHA"
          export CUA_E2E_DECLARATIONS_FILE="$PWD/artifacts/refusal/cases.jsonl"
          export CUA_E2E_ENVIRONMENT_FILE="$PWD/artifacts/refusal/environment.jsonl"
          export CUA_E2E_RESULTS_FILE="$PWD/artifacts/refusal/results.jsonl"
          export CUA_E2E_RECORDINGS_ROOT="$PWD/artifacts/refusal/recordings"
          export CUA_E2E_COMPOSITOR=openbox-x11 CUA_E2E_INPUT_BACKENDS=atspi,xsend-event,xtest
          xvfb-run -a --server-args="-screen 0 1920x1080x24" dbus-run-session -- bash -c '
            set -euo pipefail
            openbox > artifacts/refusal/openbox.log 2>&1 & wm=$!
            picom --backend xrender --config /dev/null > artifacts/refusal/picom.log 2>&1 & compositor=$!
            trap "kill -TERM $wm $compositor 2>/dev/null || true; wait $wm $compositor 2>/dev/null || true" EXIT
            sleep 2
            cargo test --locked -p cua-driver --manifest-path libs/cua-driver/rust/Cargo.toml --test harness_gtk3_test -- --ignored harness_gtk3_type_text_px_ --nocapture --test-threads=1 2>&1 | tee artifacts/refusal/typing.log
          '
      - name: Require both exact typed outcomes and original oracles
        run: |
          python3 - <<'VERIFY'
          import json,os
          from pathlib import Path
          p=Path('artifacts/refusal')
          identity=json.loads((p/'identity.json').read_text())
          assert identity['product']=='opensky-driver' and identity['source']==os.environ['CUA_DRIVER_SOURCE_SHA']
          rows=[json.loads(l) for l in (p/'results.jsonl').read_text().splitlines()]
          expected={'linux-gtk3-type-text-px-background','linux-gtk3-type-text-px-foreground'}
          assert len(rows)==2 and {r['cell_id'] for r in rows}==expected
          for r in rows:
              assert r['test_status']=='pass', r
              assert set(r['oracles']).issubset(set(r['passed_oracles'])), r
              assert (p/r['evidence']['video']).stat().st_size>0
          (p/'verified-outcomes.json').write_text(json.dumps({'source':identity['source'],'cases':sorted(expected),'allPassed':True,'scope':'Two unchanged canonical rows on development binary; not full release certification'},indent=2))
          VERIFY
      - name: Retain all outcomes and recording evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-pixel-refusal-check
          path: artifacts/refusal
          if-no-files-found: error
          retention-days: 14
