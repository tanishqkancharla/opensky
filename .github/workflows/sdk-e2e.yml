name: OpenSky SDK experience tests

on:
  push:
    branches: [codex/computer-observed-parity]
    paths: ['src/**', 'e2e/**', '.github/workflows/sdk-e2e.yml']
  workflow_dispatch:
    inputs:
      stage:
        description: 'Linux experience ramp; start with smoke'
        type: choice
        default: smoke
        options: [smoke, five, full]

permissions:
  contents: read

concurrency:
  group: sdk-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENSKY_DRIVER_REF: ac13520622d2cb346a0f03c53b73a87980fe6661
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tanishqkancharla/cua
          ref: ${{ env.OPENSKY_DRIVER_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          workspaces: 'libs/cua-driver/rust -> target'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libei-dev libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev
      - name: Build pinned OpenSky Driver
        env:
          CUA_DRIVER_SOURCE_SHA: ${{ env.OPENSKY_DRIVER_REF }}
        run: |
          cargo build --locked -p cua-driver --manifest-path libs/cua-driver/rust/Cargo.toml
          mkdir -p driver-artifact
          cp libs/cua-driver/rust/target/debug/cua-driver driver-artifact/opensky-driver
          driver-artifact/opensky-driver --opensky-driver-identity > driver-artifact/identity.json
          python3 - <<'PY'
          import json, os
          identity = json.load(open('driver-artifact/identity.json'))
          assert identity['product'] == 'opensky-driver' and identity['protocolVersion'] == 1
          assert identity['source'] == os.environ['OPENSKY_DRIVER_REF']
          PY
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: sdk-test-driver
          path: driver-artifact
          retention-days: 14

  experience:
    name: SDK / ${{ matrix.scenario }}
    needs: driver
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: ${{ fromJSON(inputs.stage == 'full' && '["PASTE-B01","PASTE-B02","PASTE-B03","SCROLL-B01","STALE-B01","CONTEXT-B-list","CONTEXT-B-article","CONTEXT-B-table","TEXT-B01","FRESH-B01"]' || inputs.stage == 'five' && '["TEXT-B01","FRESH-B01","CONTEXT-B-list","CONTEXT-B-article","SCROLL-B01"]' || '["TEXT-B01","FRESH-B01"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - name: Build public SDK and install test dependencies
        run: |
          npm ci --ignore-scripts
          npm run build
          npm ci --ignore-scripts --prefix e2e
          npm run typecheck --prefix e2e
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: sdk-test-driver
          path: .driver
      - name: Install disposable desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth dbus-x11 at-spi2-core openbox picom ffmpeg xterm xdotool x11-utils \
            libpipewire-0.3-0 libei1 libxkbcommon0 libxtst6
          google-chrome --version
          chrome_payload="$(readlink -f "$(command -v google-chrome)")"
          test "$chrome_payload" = /opt/google/chrome/google-chrome
          sudo chown root:root /opt /opt/google /opt/google/chrome "$chrome_payload"
          sudo chmod go-w /opt /opt/google /opt/google/chrome "$chrome_payload"
          chmod +x .driver/opensky-driver
      - name: Drive the SDK in a disposable desktop
        env:
          SDK_SCENARIO: ${{ matrix.scenario }}
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            dbus-run-session -- bash e2e/ci/linux.sh
      - name: Upload public results, screenshots and recording
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: sdk-${{ matrix.scenario }}
          path: artifacts/sdk-e2e
          if-no-files-found: warn
          retention-days: 14

  native-linux-probe:
    name: Native Linux runtime availability (not a parity score)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 openbox at-spi2-core xdotool libgtk-3-0t64 libgbm1 libnss3 libasound2t64
      - name: Probe the official Linux distribution
        run: bash e2e/ci/native-linux-probe.sh
      - name: Retain availability evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: native-linux-availability
          path: artifacts/native-linux
          retention-days: 14

  office-smoke:
    name: Linux document / ${{ matrix.backend }}
    needs: driver
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [native, opensky]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real office desktop and scorer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus-x11 openbox at-spi2-core xdotool x11-utils libreoffice-writer libreoffice-gtk3 fonts-liberation libpipewire-0.3-0 libei1 libxtst6
          npm ci --ignore-scripts
          npm run build
          npm ci --ignore-scripts --prefix e2e
          python -m pip install -r evals/parity/osworld/requirements.txt
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: sdk-test-driver
          path: .driver
      - name: Drive and grade the real document
        env:
          OPENSKY_LINUX_OFFICE_BACKEND: ${{ matrix.backend }}
        run: |
          chmod +x .driver/opensky-driver
          bash e2e/ci/native-linux-probe.sh
      - name: Retain saved document, observations and cleanup
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linux-office-${{ matrix.backend }}
          path: |
            artifacts/linux-office
            artifacts/native-linux
          retention-days: 14
